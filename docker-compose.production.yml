services:
  postgres:
    ports: !reset []

  app:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      # The app port is private to this Compose network. The gateway sets these headers.
      APP_TRUSTED_PROXY: "*"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g

  messenger-api:
    environment:
      MESSENGER_APP_ENV: production
    pids_limit: 128
    mem_limit: 512m

  livekit:
    ports: !override
      - "7881:7881/tcp"
      - "7882:7882/udp"
    command:
      - |
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # use_external_ip:true silently ignores node_ip (STUN-guessed IP
          # wins) — production needs the explicit, known public IP instead.
          use_external_ip: false
          node_ip: ${MESSENGER_LIVEKIT_EXTERNAL_IP:?Set MESSENGER_LIVEKIT_EXTERNAL_IP in .env for production}
        keys:
          ${MESSENGER_LIVEKIT_API_KEY:?Set MESSENGER_LIVEKIT_API_KEY in .env}: ${MESSENGER_LIVEKIT_API_SECRET:?Set MESSENGER_LIVEKIT_API_SECRET in .env}
        webhook:
          api_key: ${MESSENGER_LIVEKIT_API_KEY}
          urls:
            - http://messenger-api:8000/api/messenger/v1/livekit/webhook
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    pids_limit: 128
    mem_limit: 512m

  clamav:
    pids_limit: 128
    mem_limit: 1g

  redis:
    pids_limit: 64
    mem_limit: 192m

  gateway:
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx.production.conf.example:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx.ssl-listener.conf:/etc/nginx/universalai-listener.conf:ro
      - ./deploy/tls:/run/tls:ro
    pids_limit: 128
    mem_limit: 128m
