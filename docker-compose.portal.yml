# Apply after docker-compose.production.yml when Nginx on the host terminates TLS.
services:
  gateway:
    ports: !override
      - "127.0.0.1:${UNIVERSALAI_GATEWAY_PORT:-8085}:8443"
    volumes: !override
      - ./deploy/nginx.production.conf.example:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx.proxy-listener.conf:/etc/nginx/universalai-listener.conf:ro
